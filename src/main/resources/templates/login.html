<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login — Travel Buddy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e3a5f, #3b82f6); min-height: 100vh; display: flex; align-items: center; }
        .card { border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .btn-google { background: white; color: #333; border: 1px solid #ddd; font-weight: 500; }
        .btn-google:hover { background: #f8f8f8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card p-5 text-center">
                    <h1 class="mb-1">✈️</h1>
                    <h3 class="mb-1 fw-bold">Travel Buddy</h3>
                    <p class="text-muted mb-4">O teu companheiro de viagem</p>

                    <a href="/oauth2/authorization/google" class="btn btn-google btn-lg w-100 d-flex align-items-center justify-content-center gap-2">
                        <img src="https://www.google.com/favicon.ico" width="20" alt="Google">
                        Entrar com Google
                    </a>

                    <p class="text-muted small mt-4">
                        Ao entrar, aceitas os termos de utilização da plataforma.
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
