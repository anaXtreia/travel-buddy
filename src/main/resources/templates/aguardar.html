<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A pesquisar… — Travel Buddy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f1f5f9; }
        .navbar-custom { background: #1e3a5f; }
        .back-btn { color: white; text-decoration: none; opacity: 0.85; }
        .back-btn:hover { opacity: 1; color: white; }
        .result-header { background: linear-gradient(135deg, #1e3a5f, #2563eb); color: white; padding: 1.5rem 0; }
        .stat-chip { background: rgba(255,255,255,0.15); border-radius: 20px; padding: 4px 14px;
                     font-size: 0.85rem; display: inline-block; }

        /* ── Shimmer ──────────────────────────────────────────────────── */
        .shimmer-wrap { border-radius: 12px; overflow: hidden; }
        .sh {
            background: linear-gradient(90deg, #e8edf2 25%, #d4dce6 50%, #e8edf2 75%);
            background-size: 400% 100%;
            animation: shimmer 1.6s ease-in-out infinite;
            border-radius: 6px;
        }
        @keyframes shimmer {
            0%   { background-position: 100% 50%; }
            100% { background-position: -100% 50%; }
        }
        .sh-img  { width: 80px; height: 80px; border-radius: 10px; flex-shrink: 0; }
        .sh-line { height: 14px; margin-bottom: 8px; }
        .sh-line.lg { height: 18px; width: 70%; }
        .sh-line.md { width: 50%; }
        .sh-line.sm { width: 35%; }
        .sh-line.price { height: 22px; width: 60px; }
        .sh-badge { height: 20px; width: 48px; border-radius: 10px; display: inline-block; }

        .hotel-card-sk { border-radius: 12px; }
        .tab-nav .nav-link { font-weight: 600; color: #4b5563; border-radius: 10px 10px 0 0; }
        .tab-nav .nav-link.active { color: #1d4ed8; border-color: #dee2e6 #dee2e6 #fff; }

        /* spinner no header */
        .search-spinner {
            width: 28px; height: 28px;
            border: 3px solid rgba(255,255,255,0.35);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* erro */
        #erroBox { display: none; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-custom px-4 py-2">
    <a href="/search" class="back-btn d-flex align-items-center gap-2">
        <span>←</span>
        <span class="fw-bold fs-5">✈️ Travel Buddy</span>
    </a>
    <div class="d-flex align-items-center gap-3">
        <img th:src="${userPhoto}" class="rounded-circle" width="34" height="34" alt="foto">
        <span class="text-white fw-medium" th:text="${userName}">Utilizador</span>
        <form th:action="@{/logout}" method="post" class="m-0">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-outline-light btn-sm px-3">Sair</button>
        </form>
    </div>
</nav>

<!-- Cabeçalho -->
<div class="result-header">
    <div class="container">
        <div class="d-flex align-items-center justify-content-between gap-3 flex-wrap">
            <div>
                <h2 class="fw-bold mb-1 d-flex align-items-center gap-3">
                    <span th:text="${cidade != null ? cidade : 'A pesquisar…'}">A pesquisar…</span>
                    <span class="search-spinner"></span>
                </h2>
                <span class="stat-chip">A recolher hotéis, voos e meteorologia…</span>
            </div>
            <a href="/search" class="btn btn-outline-light btn-sm px-4">🔍 Nova pesquisa</a>
        </div>
    </div>
</div>

<!-- Erro (aparece se a API falhar) -->
<div class="container mt-4" id="erroBox">
    <div class="alert alert-danger d-flex align-items-center gap-2">
        <span>⚠️</span>
        <span id="erroMsg">Ocorreu um erro durante a pesquisa.</span>
    </div>
    <a href="/search" class="btn btn-primary">← Nova pesquisa</a>
</div>

<!-- Skeletons -->
<div class="container py-4" id="skeletonArea">

    <!-- Tabs -->
    <ul class="nav nav-tabs tab-nav mb-4">
        <li class="nav-item"><button class="nav-link active">🏨 Hotéis</button></li>
        <li class="nav-item"><button class="nav-link">✈️ Voos</button></li>
        <li class="nav-item"><button class="nav-link">🌤️ Meteorologia</button></li>
        <li class="nav-item"><button class="nav-link">🗺️ Mapa</button></li>
    </ul>

    <!-- Skeleton cards de hotéis -->
    <div class="row g-3">
        <div class="col-md-6 col-xl-4" th:each="i : ${#numbers.sequence(1,6)}">
            <div class="card hotel-card-sk h-100 p-3">
                <div class="d-flex gap-3">
                    <div class="sh sh-img"></div>
                    <div class="flex-grow-1">
                        <div class="sh sh-line lg"></div>
                        <div class="sh sh-line md"></div>
                        <div class="d-flex gap-2 mt-2">
                            <div class="sh sh-badge"></div>
                            <div class="sh sh-badge" style="width:80px"></div>
                        </div>
                    </div>
                </div>
                <div class="mt-3 pt-2 border-top d-flex justify-content-between align-items-center">
                    <div class="sh sh-line sm" style="margin:0"></div>
                    <div class="sh sh-line price" style="margin:0"></div>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const pesquisaId = /*[[${pesquisaId}]]*/ '';

    function verificarStatus() {
        fetch('/api/status?id=' + encodeURIComponent(pesquisaId))
            .then(r => r.json())
            .then(data => {
                if (!data.pronto) {
                    setTimeout(verificarStatus, 1500);
                    return;
                }
                if (data.erro) {
                    document.getElementById('erroBox').style.display = 'block';
                    document.getElementById('erroMsg').textContent = data.erro;
                    document.getElementById('skeletonArea').style.display = 'none';
                    document.querySelector('.search-spinner').style.display = 'none';
                    return;
                }
                // Redireciona para os resultados
                window.location.href = '/resultados?id=' + encodeURIComponent(pesquisaId);
            })
            .catch(() => setTimeout(verificarStatus, 2000));
    }

    verificarStatus();
    /*]]>*/
</script>

</body>
</html>
