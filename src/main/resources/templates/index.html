<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Travel Buddy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a5f, #3b82f6);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .hero { text-align: center; }
        .btn-start { font-size: 1.1rem; padding: 0.75rem 2rem; border-radius: 50px; }
    </style>
</head>
<body>
    <div class="hero">
        <div class="mb-3" style="font-size: 4rem;">✈️</div>
        <h1 class="fw-bold mb-2">Travel Buddy</h1>
        <p class="lead mb-4 opacity-75">Pesquisa voos, hotéis e meteorologia para a tua próxima viagem.</p>

        <!-- Se autenticado, vai direto ao dashboard; senão, vai ao login -->
        <a sec:authorize="isAuthenticated()" href="/search"
           class="btn btn-light btn-start fw-semibold">
            Ir para o Dashboard →
        </a>
        <a sec:authorize="isAnonymous()" href="/login"
           class="btn btn-light btn-start fw-semibold">
            Começar →
        </a>
    </div>
</body>
</html>
